<script>
document.addEventListener('DOMContentLoaded', function () {

  // ── ページ上部への章ナビゲーション自動配置 ─────────────────
  const bottomNav = document.querySelector('nav.page-navigation');
  if (bottomNav) {
    const topNav = bottomNav.cloneNode(true);
    topNav.classList.add('top-page-navigation');
    
    // パンくずリストがある場合はその直後に配置、なければ main 先頭に配置
    const breadcrumb = document.querySelector('nav.quarto-page-breadcrumbs');
    const mainContent = document.querySelector('main.content');
    
    if (breadcrumb && breadcrumb.parentNode) {
      breadcrumb.parentNode.insertBefore(topNav, breadcrumb.nextSibling);
    } else if (mainContent) {
      const titleBlock = mainContent.querySelector('.quarto-title-block') || mainContent.firstElementChild;
      mainContent.insertBefore(topNav, titleBlock);
    }
  }

  // ── 目次（TOC）から「📄 chapX.pdf」や「📄 p.X」を取り除く ───────
  const tocLinks = document.querySelectorAll('#TOC a');
  tocLinks.forEach(function (a) {
    a.innerHTML = a.innerHTML.replace(/\s*📄[\s\S]*$/i, '').trim();
  });

  // ── 右サイドバー（目次）トグル ──────────────────────────
  const rightSidebar = document.getElementById('quarto-margin-sidebar');
  if (rightSidebar) {
    const btn = document.createElement('button');
    btn.id = 'right-sidebar-toggle';
    btn.setAttribute('aria-label', '目次を折りたたむ');
    btn.innerHTML = '&#8250;'; // ›

    document.body.appendChild(btn);

    function positionRightBtn() {
      const rect = rightSidebar.getBoundingClientRect();
      const visible = rect.width > 10;
      btn.innerHTML = visible ? '&#8250;' : '&#8249;';
      btn.style.left = visible
        ? (rect.left - 24) + 'px'
        : (window.innerWidth - 14) + 'px';
    }
    positionRightBtn();

    btn.addEventListener('click', function () {
      const isVisible = rightSidebar.getBoundingClientRect().width > 10;
      if (isVisible) {
        rightSidebar.style.width = '0';
        rightSidebar.style.minWidth = '0';
        rightSidebar.style.overflow = 'hidden';
        rightSidebar.style.padding = '0';
        btn.innerHTML = '&#8249;';
        btn.style.left = (window.innerWidth - 14) + 'px';
      } else {
        rightSidebar.style.width = '';
        rightSidebar.style.minWidth = '';
        rightSidebar.style.overflow = '';
        rightSidebar.style.padding = '';
        btn.innerHTML = '&#8250;';
        requestAnimationFrame(() => positionRightBtn());
      }
    });

    window.addEventListener('resize', positionRightBtn);
  }
});
</script>
